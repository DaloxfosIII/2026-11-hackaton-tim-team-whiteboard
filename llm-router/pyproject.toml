[project]
name = "llm-router"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Felix Granzow", email = "FelixGranzow@rotgedacht.onmicrosoft.com" }
]
requires-python = ">=3.13"
dependencies = [
    "anthropic>=2.8.0",
    "pydantic",
]

[project.scripts]
llm-router = "llm_router:main"
llm-router-chat = "llm_router.chat:cli"
llm-router-eval = "llm_router.eval:cli"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
